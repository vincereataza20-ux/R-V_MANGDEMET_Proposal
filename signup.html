<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create an Account | Mang Demet Lechon &amp; Liempo</title><link rel="stylesheet" href="assets/style.css"></head>
<body data-page="signup"><div id="site-header"></div><main class="auth-main"><section class="auth-aside"><span class="eyebrow">WELCOME TO THE TABLE</span><h1>Make your next meal <em>easy.</em></h1><p>Create an account to reserve your favorites, manage pickup times, and keep track of every order.</p><div class="auth-aside-mark">M<span>✦</span>D</div></section><section class="auth-content"><form class="form-card auth-card" id="signup-form" novalidate><span class="eyebrow">CUSTOMER ACCOUNT</span><h2>Create your account</h2><p class="muted">A few details and you’re ready to reserve.</p><div class="form-errors" id="signup-errors" aria-live="polite"></div><label>Full name<input name="name" autocomplete="name" required></label><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Username<input name="username" autocomplete="username" required minlength="3"></label><label>Contact number<input name="phone" type="tel" autocomplete="tel" required></label><div class="form-row"><label>Password<input name="password" type="password" autocomplete="new-password" required minlength="8"></label><label>Confirm password<input name="confirm" type="password" autocomplete="new-password" required></label></div><button class="button button-primary button-wide" type="submit">Create account <span aria-hidden="true">→</span></button><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p></form></section></main><div id="site-footer"></div><script src="assets/app.js" defer></script></body></html>
